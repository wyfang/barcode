name: Windows 绿色版

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 编译 Windows 绿色版
        run: npm run package:win

      - name: 保存工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: barcode-windows-x64
          path: release/barcode-windows-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: 发布版本附件
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/barcode-windows-x64.exe
          generate_release_notes: true
